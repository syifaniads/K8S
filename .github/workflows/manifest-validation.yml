name: Validate Kubernetes manifests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
      - name: Validate manifest invariants
        run: python scripts/validate_k8s_manifests.py
